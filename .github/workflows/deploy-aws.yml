name: Deploy AWS Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - CrossyRoadServer/AwsBackend/**
      - CrossyRoadServer/Domain/**
      - infrastructure/**
      - .github/workflows/deploy-aws.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infrastructure/package-lock.json

      - name: Test score validation
        run: dotnet test CrossyRoadServer/TestProject/TestProject.csproj --configuration Release

      - name: Publish Lambda artifact
        run: >-
          dotnet publish CrossyRoadServer/AwsBackend/CrossyRoad.AwsBackend.csproj
          --configuration Release
          --output infrastructure/.artifacts/backend

      - name: Install CDK dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Test CDK infrastructure
        run: dotnet test infrastructure/test/CrossyRoad.Aws.Tests/CrossyRoad.Aws.Tests.csproj --configuration Release

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::237076104892:role/CrossyRoad-GitHubActions-production
          aws-region: ap-northeast-1

      - name: Deploy production stacks
        working-directory: infrastructure
        run: >-
          npx cdk deploy
          CrossyRoadDataStack-production
          CrossyRoadIdentityStack-production
          CrossyRoadApiStack-production
          CrossyRoadWebStack-production
          CrossyRoadMonitoringStack-production
          --require-approval never
